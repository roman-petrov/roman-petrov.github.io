# yaml-language-server: $schema=https://raw.githubusercontent.com/rendercv/rendercv/refs/tags/v2.8/schema.json
cv:
  name: Roman Petrov
  headline: Software Developer
  location: Yoshkar-Ola, Russian Federation
  email: romanpetrov@list.ru
  phone: "+79061370326"
  social_networks:
    - network: GitHub
      username: roman-petrov
  sections:
    "🛠 Skills":
      - label: "💻 Skills"
        details: Programming · User experience · Git · Dart/Flutter · TypeScript/JavaScript · HTML / CSS · React · C# · C/C++ · Markdown
      - label: "🌍 Languages"
        details: English · Russian
      - label: "🎸 Hobbies"
        details: Programming, Travel, Camping, Guitar

    # One Profile block (like resume.md): prose → list → prose → list. No fake sub-headings.
    "👤 Profile":
      - name: "My favorite tool in software development is Occam's razor."
        summary: "The areas of my proficiency are:"
        highlights:
          - "**problem solving:** analysis, communication, decomposition, MVP"
          - "**programming:** modular, testable, readable, compact, efficient code"
          - "**code quality:** automated code analysis, linting, code review"
          - "**project workflow:** automation, simplification, documentation"
          - "**user experience:** simplicity, visual perfection, screenshot tests"
          - "**open source:** use, contribute, learn"
      - name: "I prefer functional programming to object oriented approach and my favorite code unit is pure function."
        summary: "I would like to land a software developer position in a company that:"
        highlights:
          - cares about the code quality in projects
          - cares about the user experience quality in products
          - provides possibilities to grow as professional

    "💼 Experience":
      - company: "[TravelLine](https://www.travelline.ru/)"
        position: Lead developer and team lead
        start_date: 2013
        end_date: present
        summary: "I'm currently working for TravelLine company as a front-end architect, team lead and developer. My primary goal is to move company products from outdated and ineffective development stack to Flutter:"
        highlights:
          - make products cross-platform
          - improve user experience and user interface quality
          - design and develop Flutter ecosystem, tools, components, and workflow
          - "**TLUI3.0 (NOW)** — TravelLine User Interface library and design system based on Flutter (architect, lead developer and team lead)"
          - "**TLF** — TravelLine Flutter tool to automate workflow for company Flutter projects (single developer)"
          - "**TLUI** — TravelLine User Interface library and design system (lead developer and team lead)"
          - Payment module front-end for online booking engine (single developer)
      - company: "[iSpring](http://www.ispringsolutions.com/)"
        position: Developer
        start_date: 2007
        end_date: 2013
        highlights:
          - Flash media player & charting library (developer)
          - "[SilverX](https://web.archive.org/web/20120506055102/http://www.silverx.net/) — Flash to Silverlight converter (single developer, website developer)"
          - "[PowerMessage](https://web.archive.org/web/20171020002940/http://www.powermessagepro.com/) — PowerPoint add-on to build presentations from templates (single developer)"
      - company: "[CPS Labs](https://www.cpslabs.net/)"
        position: Lead developer and team lead
        start_date: 2003
        end_date: 2007
        highlights:
          - "[JobWindow](https://www.cpslabs.net/project/jobwindow-2-3.html) — Job search system in Switzerland (developer)"
          - "[ActiveSWF](https://www.cpslabs.net/product/activeswf-3-5.html) — SWF file (Flash) generation library (single developer)"
          - "SlingPlayer — Streaming media player for [SlingMedia](https://en.wikipedia.org/wiki/Sling_Media) (lead developer and team lead)"

    "🚀 Challenging activities":
      - name: "**🏆 Machine learning contest**"
        date: 2015
        summary: I took part in the Beeline Big Data contest. It was my first experience in machine learning so it's been quite a challenge for me. I was ranked the 236 out of 832 participants.
        highlights:
          - "References (in Russian): contest info and results at [beeline.ru](https://special.habrahabr.ru/beeline/)"
      - name: "**🕹 ZX-Spectrum**"
        start_date: 1995
        end_date: 2000
        summary: During my school years my favorite hobby was assembler programming on ZX-Spectrum. I'm the author of RIP (Real Information Packer) — LZW/Huffman data compression algorithm and application. This was a challenge and I managed to achieve one of the best compression ratios compared to other ZX-Spectrum data compression tools.
        highlights:
          - "About me at [speccy.info](https://speccy.info/%D0%A0%D0%BE%D0%BC%D0%B0%D0%BD_%D0%9F%D0%B5%D1%82%D1%80%D0%BE%D0%B2)"
          - "RIP at [speccy.info](https://speccy.info/RIP_(%D1%83%D0%BF%D0%B0%D0%BA%D0%BE%D0%B2%D1%89%D0%B8%D0%BA))"
          - "About RIP at [zxpress.ru](https://zxpress.ru/article.php?id=8510)"

    "🎓 Education":
      - institution: Volga State University of Technology
        area: Yoshkar-Ola
        degree: Master
        start_date: 1999-09
        end_date: 2004-05

design:
  theme: classic
  page:
    size: a4
    top_margin: 0.6in
    bottom_margin: 0.55in
    left_margin: 0.65in
    right_margin: 0.65in
    show_footer: true
    show_top_note: false
  colors:
    body: rgb(32, 36, 40)
    name: rgb(15, 70, 95)
    headline: rgb(70, 85, 95)
    connections: rgb(75, 90, 100)
    section_titles: rgb(15, 70, 95)
    links: rgb(20, 95, 120)
    footer: rgb(150, 155, 160)
  typography:
    line_spacing: 0.75em
    alignment: left
    date_and_location_column_alignment: right
    font_family:
      body: Lato
      name: Lato
      headline: Lato
      connections: Lato
      section_titles: Lato
    font_size:
      body: 11pt
      name: 32pt
      headline: 12pt
      connections: 10.5pt
      section_titles: 1.35em
    small_caps:
      name: false
      headline: true
      connections: false
      section_titles: true
    bold:
      name: true
      headline: false
      connections: false
      section_titles: true
  links:
    underline: false
    show_external_link_icon: false
  header:
    alignment: left
    space_below_name: 0.3cm
    space_below_headline: 0.45cm
    space_below_connections: 0.7cm
    connections:
      phone_number_format: international
      hyperlink: true
      show_icons: true
      display_urls_instead_of_usernames: false
      separator: "·"
      space_between_connections: 0.5cm
  section_titles:
    type: with_partial_line
    line_thickness: 1pt
    space_above: 0.85cm
    space_below: 0.4cm
  sections:
    allow_page_break: true
    space_between_regular_entries: 1.2em
    space_between_text_based_entries: 0.4em
    show_time_spans_in:
      - "💼 Experience"
  entries:
    date_and_location_width: 3.9cm
    side_space: 0.2cm
    space_between_columns: 0.15cm
    allow_page_break: false
    short_second_row: true
    summary:
      space_above: 0.14cm
      space_left: 0cm
    highlights:
      bullet: "•"
      nested_bullet: "◦"
      space_left: 0.15cm
      space_above: 0.12cm
      space_between_items: 0.12cm
      space_between_bullet_and_text: 0.5em
  templates:
    footer: "*NAME — PAGE_NUMBER/TOTAL_PAGES*"
    one_line_entry:
      main_column: "**LABEL** · DETAILS"
    education_entry:
      main_column: |-
        **DEGREE**, INSTITUTION
        SUMMARY
        HIGHLIGHTS
      degree_column: ""
      date_and_location_column: |-
        AREA
        DATE
    experience_entry:
      main_column: |-
        **COMPANY**
        *POSITION*
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: |-
        DATE
    normal_entry:
      main_column: |-
        NAME
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: DATE

locale:
  language: english

settings:
  current_date: today
  render_command:
    output_folder: rendercv_output
    typst_path: OUTPUT_FOLDER/NAME_IN_SNAKE_CASE_CV.typ
    pdf_path: OUTPUT_FOLDER/NAME_IN_SNAKE_CASE_CV.pdf
    markdown_path: OUTPUT_FOLDER/NAME_IN_SNAKE_CASE_CV.md
    html_path: OUTPUT_FOLDER/NAME_IN_SNAKE_CASE_CV.html
    png_path: OUTPUT_FOLDER/NAME_IN_SNAKE_CASE_CV.png
  bold_keywords: []
  pdf_title: NAME - CV
