name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Bun skips puppeteer's postinstall, so the browser is fetched explicitly.
      - name: Install Chrome for Puppeteer
        run: bunx puppeteer browsers install chrome

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Check generated resume.md is committed
        run: git diff --exit-code -- resume.md
