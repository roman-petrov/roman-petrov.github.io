experience:
  icon: 💼
  title: Experience
  jobs:
    - company: TravelLine
      url: https://www.travelline.ru/
      roles: [front-end architect, tech lead, lead developer]
      from: 2013
      to: 2026
      summary: >-
        I ran the company design systems in a team of 5-7 engineers, combining all three roles. In the last years I
        designed not only the architecture but the whole product concept — Reactor started as my idea and I planned all
        of it myself.
      duties:
        - designed the architecture of the design systems and the front-end products
        - built the whole development cycle of the internal projects — tools, workflow, releases and documentation
        - led the team, mentored the engineers, reviewed the code and kept the quality high
        - wrote the core parts of the libraries myself
        - analyzed the user experience and was responsible for its quality
      projects:
        - name: Reactor
          note: >-
            Internal front-end platform of 25 packages that work as a single product. It unifies the development stack
            and the design of all TravelLine products, and keeps the API and the tools simple.

            A new SPA project needs no setup and no boilerplate and is production ready in about five minutes: design
            system, state management, router, localization, our own storybook, screenshot testing and coding conventions
            out of the box, and one CLI tool for the whole workflow from dev server and build to linting, tests, visual
            regression and release.

            Already in production, and the technical teams in the company are moving to it.
          roles: [architect, tech lead, lead developer]
          stack: [TypeScript, React, Vite, SCSS]
        - name: TLUI3.0
          note: >-
            Move of the front-end stack to Flutter Web. In one year the team built the design system components, the
            build and workflow tools and a way to start a new project in minutes.

            The company did not adopt Flutter, so only a part of the work went to production.
          roles: [architect, tech lead, lead developer]
          stack: [Dart, Flutter]
        - name: TLUI
          note: >-
            Design system and component library that made the whole B2B account and intranet look and work the same way.

            The stack is old and there were almost no tools around it, but the library still runs every screen of the
            TravelLine back office and is supported and improved.
          roles: [developer, tech lead]
